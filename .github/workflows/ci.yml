name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    # 在基分支上跑一次，为后续 PR 预热缓存（PR 分支的缓存不跨 PR 共享）
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 两条独立的链，各自内部按 needs 串行：
#
#   docs ────────────────────────────────────────────────  文档，独立
#   python ──────────────────────────────────────────────  media worker，独立
#
#   contracts ──→ format ──→ lint ──→ typecheck ──→ test ──→ db ──→ integration
#   类型真相源      快失败的排前面                              最贵的排最后
#
# 拆成多节点是为了让失败位置在 Actions 图上直接可见，而不是埋在一个大 job 的日志里。
# 代价是每个 job 都要重新起 runner 并装依赖——用墙钟时间换归因速度。
# 重复的准备步骤抽在 .github/actions/setup，不在各 job 里复制粘贴。
jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-docs.txt

      - name: Install doc build deps
        run: pip install -r scripts/requirements-docs.txt

      - name: Rebuild docs
        run: python3 scripts/build-docs.py

      - name: Assert generated HTML is in sync with _src
        run: |
          if ! git diff --exit-code -- docs/; then
            echo "::error::docs/*.html 与 docs/_src/*.md 不同步。本地运行 'python3 scripts/build-docs.py' 后提交生成结果。"
            exit 1
          fi

  # Python 工具链，与 Node 链无关，并行跑
  python:
    name: python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/media
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: workers/media/uv.lock

      - run: uv sync --frozen

      # 测试用真实 ffmpeg 跑真实文件——命令构造对不对只有真跑才知道
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest -q

  # 排在链首：TS 类型、运行时校验、给 Python 的 JSON Schema 都由它派生。
  # 它一漂移，后面每一步的结论都不可信（01-architecture.md §3）。
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          build-contracts: 'true'

      - name: Assert generated contracts are in sync with src
        run: |
          if ! git diff --exit-code -- packages/contracts/generated; then
            echo "::error::packages/contracts/generated 与 src 不同步。本地运行 'pnpm contracts:build' 后提交生成结果。"
            exit 1
          fi

  format:
    name: format
    needs: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm format

  # 含模块边界规则（01-architecture.md §5.2）与断言防护（ADR-0011）
  lint:
    name: lint
    needs: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          build-contracts: 'true'
      - run: pnpm lint

  typecheck:
    name: typecheck
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          build-contracts: 'true'
      - run: pnpm typecheck

  test:
    name: test
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          build-contracts: 'true'
      - run: pnpm test

  # 最贵的一步排最后：起三个容器 + 真实迁移 + seed
  db:
    name: db
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # 用仓库自己的 compose 起服务：GHA 的 services: 块无法覆写容器 command，
      # 而 minio 需要 `server /data`。同一份文件，本地与 CI 零分歧。
      - name: Start infra
        # 一次性任务不能进 --wait 列表：容器退出会被判定为失败，即使 exit 0。
        # 长驻服务用 --wait 等健康检查，bucket 初始化用 run --rm 单独跑并取其退出码。
        run: |
          docker compose -f infra/docker-compose.yml up -d --wait postgres redis minio
          docker compose -f infra/docker-compose.yml run --rm minio-init

      - name: Migrate + seed（验证 schema 与夹具真的能落库）
        run: pnpm build && pnpm db:migrate && pnpm db:seed
        env:
          DATABASE_URL: postgresql://drama:drama@localhost:5432/drama

      - name: Dump infra logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --tail=50

  # 队列层的 bug（幂等、恢复、限流）在单测里几乎不可见，在生产上表现为
  # 「莫名其妙多扣了钱」或「任务卡死」，所以必须打真实 Redis / PG / MinIO
  integration:
    name: integration
    needs: db
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          build-contracts: 'true'

      - name: Start infra
        run: |
          docker compose -f infra/docker-compose.yml up -d --wait postgres redis minio
          docker compose -f infra/docker-compose.yml run --rm minio-init

      - name: Migrate + seed
        run: pnpm build && pnpm db:migrate && pnpm db:seed
        env:
          DATABASE_URL: postgresql://drama:drama@localhost:5432/drama

      - name: Integration tests（真实 Redis + Postgres + MinIO）
        run: pnpm test:int
        env:
          DATABASE_URL: postgresql://drama:drama@localhost:5432/drama
          REDIS_URL: redis://localhost:6379
          S3_INTERNAL_ENDPOINT: http://localhost:9000

      - name: Dump infra logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --tail=50
