name: Setup
description: pnpm + Node + 依赖安装。每个 job 跑在全新 runner 上，这些步骤必然重复，抽出来避免复制粘贴。

inputs:
  build-contracts:
    description: 是否构建 packages/contracts（typecheck / test / db 需要它的 dist）
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm

    - shell: bash
      run: pnpm install --frozen-lockfile

    - if: inputs.build-contracts == 'true'
      shell: bash
      run: pnpm contracts:build
