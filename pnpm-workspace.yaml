packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 11 默认拦截依赖的 postinstall 并硬失败。这是好默认值——不要为了让它闭嘴就放行。
#
# esbuild 是 vitest → vite 的传递依赖，它的 postinstall 只是二进制兜底；
# 平台二进制本身通过 optionalDependencies 就位。实测拦掉后 vitest 照常工作，
# 所以这里选 false（明知且不执行）而不是 true。不执行的脚本比执行的脚本安全。
allowBuilds:
  esbuild: false
  # msgpackr-extract 是 bullmq → msgpackr 的原生加速器，纯 JS 有完整 fallback。
  # 队列里跑的是花真钱的任务，这里选不执行而非放行；集成测试会实证队列可用。
  msgpackr-extract: false
